{% extends "base.html" %}{% block title %}My Orders — Banana Bliss{% endblock %}{% block content %}<main class="section page"><div class="container"><h1>My Orders</h1>{% for o in orders %}<a class="ordercard" href="{{url_for('order_detail',order_no=o.order_no)}}"><div><b>{{o.order_no}}</b><p>{{o.created_at}} • {{o.payment}}</p></div><div><strong>₹{{o.total}}</strong><span class="status">{{o.status}}</span></div></a>{% else %}<div class="empty panel"><h2>No orders yet</h2><a class="btn primary" href="{{url_for('products')}}">Shop Now</a></div>{% endfor %}</div></main>{% endblock %}
