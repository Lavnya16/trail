<article class="product-card"><a href="{{url_for('product',pid=p.id)}}" class="pimg"><span>{{p.emoji}}</span>{% if p.badge %}<i>{{p.badge}}</i>{% endif %}<button class="heart" type="button" onclick="event.preventDefault();toggleWish({{p.id}},this)">♡</button></a><div class="pbody"><a href="{{url_for('product',pid=p.id)}}"><h3>{{p.name}}</h3></a><p>{{p.weight}} • {{p.description[:62]}}{% if p.description|length>62 %}...{% endif %}</p><div class="rating">★ 4.7 <span>• 1.2k ratings</span></div><div class="price"><b>₹{{"%.0f"|format(p.price)}}</b><del>₹{{"%.0f"|format(p.mrp)}}</del><small>{{((1-p.price/p.mrp)*100)|round|int}}% off</small></div><button class="add" onclick="addToCart({{p.id}},1)">Add to Cart</button></div></article>
